name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# npm, not bun: the repo ships package-lock.json (bun.lock was removed in
# aed34de) and Vercel builds with npm, so CI matches what actually deploys.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-test-placeholder-for-build
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E Tests
    needs: [build]
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-test-placeholder-for-e2e
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      DEMO_MODE: 'true'
      # Renamed from NEXTAUTH_SECRET (the app moved to Better Auth) and padded
      # past the 32 char minimum enforced in deployed environments.
      BETTER_AUTH_SECRET: test-secret-for-ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

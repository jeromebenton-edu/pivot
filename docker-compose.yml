services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: pivot
      POSTGRES_USER: pivot
      POSTGRES_PASSWORD: pivot_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivot"]
      interval: 5s
      timeout: 3s
      retries: 5

  forecast:
    build: ./services/forecast
    expose: ["8001"]
    environment:
      FORECAST_API_KEY: ${FORECAST_API_KEY:-pivot-dev-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
